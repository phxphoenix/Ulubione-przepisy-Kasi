name: Testy i weryfikacja CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend (Vitest + Astro Check + Build)
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Zainstaluj zależności npm
        run: npm ci

      - name: Uruchom testy Vitest (unit, komponenty, walidacja JSON)
        run: npm test

      - name: Sprawdź typy i zbuduj Astro
        run: npm run build

  python-tests:
    name: Skrypty Python (unittest)
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Python 3.12 (z cache pip)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - name: Zainstaluj zależności skryptów
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Uruchom testy jednostkowe Pythona
        run: python -m unittest discover -s scripts -p "test_*.py" -v
